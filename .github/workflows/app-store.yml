# Signs Free Radio for the App Store and uploads it to App Store Connect.
# Run it by hand from the Actions tab. It does not run on push or on a pull request.

name: App Store

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-store-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appstore:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Xcode and SDKs
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks | grep -q iphoneos
          xcodebuild -showsdks | grep iphoneos

      - name: App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_KEY_P8" \
            || { echo "::error::Add the Actions secrets ASC_KEY_ID, ASC_ISSUER_ID, and ASC_KEY_P8."; exit 1; }
          umask 077
          mkdir -p "$RUNNER_TEMP/private_keys" "$HOME/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          cp "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Register the bundle ID, certificate, and App Store profile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          PROFILE_NAME: FreeRadio-AppStore-${{ github.run_id }}
        run: |
          set -euo pipefail
          ruby .github/scripts/app_store_signing.rb "$RUNNER_TEMP/signing"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/signing/env"
          set +a
          test -n "${APPLE_TEAM_ID}"
          test -n "${PROFILE_NAME}"
          test -n "${PROFILE_UUID}"
          test -f "${PROFILE_PATH}"
          security unlock-keychain -p "${SIGNING_KEYCHAIN_PASSWORD}" "${SIGNING_KEYCHAIN}"
          security default-keychain -s "${SIGNING_KEYCHAIN}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${SIGNING_KEYCHAIN_PASSWORD}" "${SIGNING_KEYCHAIN}" >/dev/null 2>&1 \
            || { echo "::error::Could not allow codesign to use the distribution key."; exit 1; }
          # Info.plist already uses build 3. This workflow's run number starts at 1,
          # so the uploaded build is the run number plus 3, which stays higher than 3.
          build=$((GITHUB_RUN_NUMBER + 3))
          test "${build}" -gt 3
          echo "BUILD_NUMBER=${build}" >> "$GITHUB_ENV"
          python3 .github/scripts/generate_app_store_project.py "$RUNNER_TEMP/xcode" "${build}"
          xcodebuild -project "$RUNNER_TEMP/xcode/FreeRadio.xcodeproj" -scheme FreeRadio -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FreeRadio.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            PRODUCT_BUNDLE_IDENTIFIER="com.ouijabored66.freeradio" \
            MARKETING_VERSION="1.1.1" \
            CURRENT_PROJECT_VERSION="$build" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            "OTHER_CODE_SIGN_FLAGS=--keychain ${SIGNING_KEYCHAIN}" \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 \
            || { grep -E 'error:|ARCHIVE FAILED|fatal error:' "$RUNNER_TEMP/archive.log" | head -40 || true; tail -40 "$RUNNER_TEMP/archive.log" || true; exit 1; }
          APP="$RUNNER_TEMP/FreeRadio.xcarchive/Products/Applications/FreeRadio.app"
          test -d "$APP"
          test -f "$APP/FreeRadio"
          test -f "$APP/Assets.car"
          test -f "$APP/AppIcon-1024.png"
          test -f "$APP/embedded.mobileprovision"
          phone_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          phone_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist")
          phone_ver=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          phone_build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          encryption=$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$APP/Info.plist")
          audio=$(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' "$APP/Info.plist")
          media=$(/usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsArbitraryLoadsForMedia' "$APP/Info.plist")
          test "$phone_id" = "com.ouijabored66.freeradio"
          test "$phone_name" = "Free Radio"
          test "$phone_ver" = "1.1.1"
          test "$phone_build" = "$build"
          test "$phone_build" -gt 3
          test "$encryption" = "false"
          test "$audio" = "audio"
          test "$media" = "true"
          codesign --verify --strict "$APP"
          echo "Archived ${phone_id} ${phone_ver} (${phone_build})"

      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/signing/env"
          set +a
          test -n "${APPLE_TEAM_ID}"
          test -n "${PROFILE_NAME}"
          security unlock-keychain -p "${SIGNING_KEYCHAIN_PASSWORD}" "${SIGNING_KEYCHAIN}"
          security default-keychain -s "${SIGNING_KEYCHAIN}"
          cat > "$RUNNER_TEMP/Export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.ouijabored66.freeradio</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FreeRadio.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/Export.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$RUNNER_TEMP/export.log" 2>&1 \
            || { grep -E 'error:|EXPORT FAILED' "$RUNNER_TEMP/export.log" | head -40 || true; tail -40 "$RUNNER_TEMP/export.log" || true; exit 1; }
          shopt -s nullglob
          ipas=("$RUNNER_TEMP/export/"*.ipa)
          test "${#ipas[@]}" -eq 1
          ipa="${ipas[0]}"
          check=$(mktemp -d)
          unzip -q "$ipa" -d "$check"
          built="$check/Payload/FreeRadio.app"
          test -d "$built"
          test -f "$built/Assets.car"
          test -f "$built/AppIcon-1024.png"
          test -f "$built/embedded.mobileprovision"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$built/Info.plist")" = "com.ouijabored66.freeradio"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$built/Info.plist")" = "Free Radio"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$built/Info.plist")" = "1.1.1"
          ipa_build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$built/Info.plist")
          test "$ipa_build" -gt 3
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$built/Info.plist")" = "false"
          codesign --verify --strict "$built"
          xcrun altool --upload-app -f "$ipa" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          {
            echo "### Free Radio 1.1.1 (${ipa_build})"
            echo "Uploaded the iOS archive to App Store Connect."
          } >> "$GITHUB_STEP_SUMMARY"
