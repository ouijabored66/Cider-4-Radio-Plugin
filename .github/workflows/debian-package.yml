# Build the Free Radio .deb and attach it to a GitHub Release.
# The package is published only as a release asset on this repository.

name: Debian package

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the .deb
        run: scripts/build-deb.sh "${{ runner.temp }}/deb"

      - name: Attach the .deb to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deb=$(echo "${{ runner.temp }}"/deb/free-radio_*_all.deb)
          gh release upload "${{ github.event.release.tag_name }}" "$deb" --clobber
